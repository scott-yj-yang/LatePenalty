site_name: LatePenalty
site_url: https://scott-yj-yang.github.io/LatePenalty
repo_url: https://github.com/scott-yj-yang/LatePenalty
repo_name: scott-yj-yang/LatePenalty

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            docstring_options:
              warn_missing_types: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Authentication: getting-started/authentication.md
      - Quick Start: getting-started/quickstart.md
  - Tutorials:
      - Gradescope Late Penalty: tutorials/gradescope-late-penalty.md
      - nbgrader Late Penalty: tutorials/nbgrader-late-penalty.md
  - API Reference:
      - gradescope_grade: api/gradescope.md
      - nbgrader_grade: api/nbgrader.md
